<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Finanzas</title>
  <meta name="description" content="Finanzas personales — listas, categorías, recurrencias y búsqueda.">
  <meta name="theme-color" content="#16161A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- "default" y no "black-translucent": con la barra translúcida iOS
       entrega a veces un viewport de 797 px (844 menos la barra de estado)
       pero lo coloca arriba, dejando 47 px muertos abajo — la franja. Con
       "default" la barra la reserva el sistema y la pinta con el theme_color
       del manifiesto (#16161A, el mismo fondo de la app). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* La fuente va con la app: sin viajes a Google, así no se pinta primero
       con la de reserva y se recoloca todo al llegar Nunito. */
    @font-face{
      font-family:"Nunito"; font-style:normal; font-weight:300 900;
      font-display:block; src:url("./fonts/nunito-latin.woff2") format("woff2");
    }
    html,body{margin:0;padding:0;background:#16161A;height:100%;min-height:100%;}
    #root{height:100%;}
    body{overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
